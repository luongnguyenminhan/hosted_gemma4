services:
  sglang:
    build: .
    image: hosted-gemma4:latest
    container_name: sglang-gemma4
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_XET_HIGH_PERFORMANCE=1
      - GGUF_REPO=HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive
      - GGUF_FILE=Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      - SERVED_MODEL_NAME=gemma-4-e4b-uncensored
    ipc: host
    shm_size: "8gb"
    command:
      - --context-length=4096
      - --mem-fraction-static=0.85
      - --max-running-requests=4
      - --attention-backend=triton
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
