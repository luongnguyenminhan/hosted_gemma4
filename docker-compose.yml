services:
  llama:
    build: .
    image: hosted-gemma4:latest
    container_name: llama-gemma4
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - LLAMA_CACHE=/models
    ipc: host
    shm_size: "8gb"
    command:
      - --hf-repo
      - HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive
      - --hf-file
      - Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
      - --alias
      - gemma-4-e4b-uncensored
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "4096"
      - --parallel
      - "2"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - --jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
