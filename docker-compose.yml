services:
  vllm:
    build: .
    image: hosted-gemma4:latest
    container_name: vllm-gemma4
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_XET_HIGH_PERFORMANCE=1
    ipc: host
    shm_size: "8gb"
    tty: true
    stdin_open: true
    command:
      - --model=google/gemma-4-E2B-it
      - --served-model-name=gemma-4-e2b-it
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --quantization=fp8
      - --kv-cache-dtype=fp8
      - --max-model-len=4096
      - --max-num-seqs=2
      - --max-num-batched-tokens=4096
      - --gpu-memory-utilization=0.85
      - --language-model-only
      - --enforce-eager
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
