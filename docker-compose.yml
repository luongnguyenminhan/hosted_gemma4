services:
  vllm:
    build: .
    image: hosted-gemma4:latest
    container_name: vllm-gemma4
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_XET_HIGH_PERFORMANCE=1
      - MODEL_REPO=TrevorJS/gemma-4-E4B-it-uncensored
      - BASE_REPO=google/gemma-4-E4B
      - MERGED_DIR=/models/merged
    ipc: host
    shm_size: "8gb"
    command:
      - --served-model-name=gemma-4-e4b-uncensored
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --quantization=bitsandbytes
      - --load-format=bitsandbytes
      - --kv-cache-dtype=fp8
      - --max-model-len=4096
      - --gpu-memory-utilization=0.85
      - --enforce-eager
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
